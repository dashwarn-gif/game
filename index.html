<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolution Express</title>
    <style>
        :root {
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --border-color: #333333;
            --text-main: #111111;
            --text-sub: #666666;
            --gray-light: #e0e0e0;
            --gray-dark: #555555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 6px;
            border: 2px solid var(--border-color);
        }

        h1 {
            font-size: 1.4rem;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        p.desc {
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.3;
        }

        /* Pool Kartu Hewan */
        .pool-section {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 14px;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .animal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .animal-card {
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-align: center;
        }

        .animal-card:hover {
            background: var(--gray-light);
        }

        .animal-card.selected {
            border-width: 3px;
            background: #e2e2e2;
        }

        .animal-card.placed {
            opacity: 0.3;
            pointer-events: none;
            border-style: dashed;
        }

        .animal-emoji {
            font-size: 1.8rem;
        }

        .animal-name {
            font-weight: bold;
            font-size: 0.8rem;
        }

        .animal-latin {
            font-size: 0.7rem;
            font-style: italic;
            color: var(--text-sub);
        }

        /* Area Kereta & Gerbong */
        .train-section {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 14px;
            overflow-x: auto;
        }

        .train-container {
            display: flex;
            gap: 10px;
            padding-bottom: 6px;
            min-width: max-content;
        }

        .locomotive {
            background: #333333;
            color: #ffffff;
            border-radius: 4px;
            padding: 12px;
            width: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .locomotive h3 {
            font-size: 0.85rem;
            text-align: center;
            margin-top: 4px;
        }

        .wagon {
            background: #ffffff;
            border: 2px dashed var(--border-color);
            border-radius: 4px;
            width: 160px;
            min-height: 140px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
        }

        .wagon:hover {
            background: #f9f9f9;
        }

        .wagon-header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .wagon-title {
            font-size: 0.8rem;
            font-weight: bold;
        }

        .wagon-capacity {
            font-size: 0.68rem;
            color: var(--text-sub);
        }

        .wagon-slots {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .placed-item {
            background: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 4px 6px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Tombol pembatalan pilihan di dalam gerbong */
        .btn-remove {
            background: transparent;
            border: none;
            color: var(--gray-dark);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 0 4px;
            line-height: 1;
        }

        .btn-remove:hover {
            color: #ff0000;
        }

        /* Kontrol */
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 4px;
            border: 2px solid var(--border-color);
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            background: #ffffff;
        }

        .btn:hover {
            background: var(--gray-light);
        }

        .btn-run {
            background: #333333;
            color: #ffffff;
        }

        .btn-run:hover {
            background: #000000;
        }

        /* Area Pohon Filogeni Hasil */
        .tree-section {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tree-svg-container {
            width: 100%;
            max-width: 750px;
            height: 380px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🚂 Evolution Express</h1>
        <p class="desc">
            Kelompokkan 10 hewan ke dalam gerbong takson yang sesuai. Setelah terisi, jalankan kereta untuk merakit <strong>Pohon Filogeni</strong>.
        </p>
    </header>

    <div class="pool-section">
        <div class="section-title">
            <span>Pilih Hewan (Klik hewan, lalu klik gerbong tujuan)</span>
            <span id="pool-counter" style="font-size:0.8rem; color:var(--text-sub);">Tersisa: 10 Hewan</span>
        </div>
        <div class="animal-grid" id="animal-pool"></div>
    </div>

    <div class="train-section">
        <div class="train-container" id="train-container">
            <div class="locomotive" id="locomotive">
                <span style="font-size: 2rem;">🚂</span>
                <h3>EVO-EXPRESS</h3>
                <span style="font-size:0.65rem; color:#ccc; margin-top:2px;">Stasiun Takson</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <button type="button" class="btn" id="btn-reset">🔄 Atur Ulang</button>
        <button type="button" class="btn btn-run" id="btn-run">🚀 Jalankan & Rakit Pohon</button>
    </div>

    <div class="tree-section hidden" id="tree-section">
        <h2 style="font-size: 1.1rem; margin-bottom: 4px;">🌳 Pohon Filogeni Hasil</h2>
        <p id="tree-status-msg" style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 12px; text-align: center;"></p>
        <div class="tree-svg-container" id="tree-canvas"></div>
    </div>
</div>

<script>
const baseAnimalsData = [
    { id: "a1", name: "Harimau", latin: "Panthera tigris", emoji: "🐅", wagonId: "w_panthera" },
    { id: "a2", name: "Singa", latin: "Panthera leo", emoji: "🦁", wagonId: "w_panthera" },
    { id: "a3", name: "Jaguar", latin: "Panthera onca", emoji: "🐆", wagonId: "w_panthera" },
    { id: "a4", name: "Cheetah", latin: "Acinonyx jubatus", emoji: "🎷", wagonId: "w_acinonyx" },
    { id: "a5", name: "Kucing Bengal", latin: "Prionailurus bengalensis", emoji: "🐈", wagonId: "w_prionailurus" },
    { id: "a6", name: "Beruk", latin: "Macaca nemestrina", emoji: "🐒", wagonId: "w_macaca" },
    { id: "a7", name: "Monyet Ekor Panjang", latin: "Macaca fascicularis", emoji: "🐵", wagonId: "w_macaca" },
    { id: "a8", name: "Babon Anubis", latin: "Papio anubis", emoji: "🦧", wagonId: "w_papio" },
    { id: "a9", name: "Lutung Kelabu", latin: "Trachypithecus obscurus", emoji: "🦍", wagonId: "w_trachypithecus" },
    { id: "a10", name: "Surili", latin: "Presbytis mitrata", emoji: "🦥", wagonId: "w_presbytis" }
];

const wagonsData = [
    { id: "w_panthera", title: "Genus Panthera", capacity: 3 },
    { id: "w_acinonyx", title: "Genus Acinonyx", capacity: 1 },
    { id: "w_prionailurus", title: "Genus Prionailurus", capacity: 1 },
    { id: "w_macaca", title: "Genus Macaca", capacity: 2 },
    { id: "w_papio", title: "Genus Papio", capacity: 1 },
    { id: "w_trachypithecus", title: "Genus Trachypithecus", capacity: 1 },
    { id: "w_presbytis", title: "Kelompok Presbytini", capacity: 1 }
];

let animalsData = [];
let selectedAnimalId = null;
let placements = {};

const poolEl = document.getElementById('animal-pool');
const trainContainerEl = document.getElementById('train-container');
const poolCounterEl = document.getElementById('pool-counter');
const treeSectionEl = document.getElementById('tree-section');
const treeCanvasEl = document.getElementById('tree-canvas');
const treeStatusMsgEl = document.getElementById('tree-status-msg');

function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initGame() {
    selectedAnimalId = null;
    placements = {};
    animalsData = shuffle(baseAnimalsData);
    treeSectionEl.classList.add('hidden');
    renderPool();
    renderWagons();
    updateCounter();
}

function renderPool() {
    poolEl.innerHTML = "";
    animalsData.forEach(animal => {
        const isPlaced = !!placements[animal.id];
        const isSelected = selectedAnimalId === animal.id;

        const card = document.createElement('div');
        card.className = `animal-card ${isPlaced ? 'placed' : ''} ${isSelected ? 'selected' : ''}`;
        card.innerHTML = `
            <span class="animal-emoji">${animal.emoji}</span>
            <span class="animal-name">${animal.name}</span>
            <span class="animal-latin">${animal.latin}</span>
        `;
        card.onclick = () => {
            if (isPlaced) return;
            selectedAnimalId = (selectedAnimalId === animal.id) ? null : animal.id;
            renderPool();
        };
        poolEl.appendChild(card);
    });
}

function renderWagons() {
    const existingWagons = trainContainerEl.querySelectorAll('.wagon');
    existingWagons.forEach(w => w.remove());

    wagonsData.forEach(wagon => {
        const wagonEl = document.createElement('div');
        wagonEl.className = 'wagon';
        
        const placedAnimals = Object.keys(placements)
            .filter(aId => placements[aId] === wagon.id)
            .map(aId => animalsData.find(a => a.id === aId));

        wagonEl.innerHTML = `
            <div class="wagon-header">
                <div class="wagon-title">🚃 ${wagon.title}</div>
                <div class="wagon-capacity">${placedAnimals.length} / ${wagon.capacity} Hewan</div>
            </div>
            <div class="wagon-slots" id="slot-${wagon.id}"></div>
        `;

        const slotsEl = wagonEl.querySelector(`#slot-${wagon.id}`);
        placedAnimals.forEach(anim => {
            const item = document.createElement('div');
            item.className = 'placed-item';
            item.innerHTML = `
                <span>${anim.emoji} ${anim.name}</span>
                <button type="button" class="btn-remove" title="Keluarkan dari gerbong">✕</button>
            `;
            item.querySelector('.btn-remove').onclick = (e) => {
                e.stopPropagation();
                delete placements[anim.id];
                renderPool();
                renderWagons();
                updateCounter();
            };
            slotsEl.appendChild(item);
        });

        wagonEl.onclick = () => {
            if (!selectedAnimalId) return;
            if (placedAnimals.length >= wagon.capacity) {
                alert("Gerbong ini sudah penuh!");
                return;
            }
            placements[selectedAnimalId] = wagon.id;
            selectedAnimalId = null;
            renderPool();
            renderWagons();
            updateCounter();
        };

        trainContainerEl.appendChild(wagonEl);
    });
}

function updateCounter() {
    const placedCount = Object.keys(placements).length;
    const remaining = animalsData.length - placedCount;
    poolCounterEl.innerText = `Tersisa: ${remaining} Hewan`;
}

function runTrainAndBuildTree() {
    const placedCount = Object.keys(placements).length;
    if (placedCount < animalsData.length) {
        alert("Harap masukkan seluruh 10 hewan ke dalam gerbong terlebih dahulu!");
        return;
    }

    let correctCount = 0;
    animalsData.forEach(a => {
        if (placements[a.id] === a.wagonId) correctCount++;
    });

    treeSectionEl.classList.remove('hidden');
    treeSectionEl.scrollIntoView({ behavior: 'smooth' });

    if (correctCount === animalsData.length) {
        treeStatusMsgEl.innerHTML = `<strong>Sempurna! (10/10 Tepat)</strong><br>Seluruh gerbong terisi sesuai takson. Pohon Filogeni berhasil terhubung sempurna!`;
    } else {
        treeStatusMsgEl.innerHTML = `<strong>Hasil: ${correctCount} dari 10 Tepat</strong><br>Beberapa hewan diletakkan di gerbong yang belum pas. Perhatikan cabang pohon di bawah:`;
    }

    renderSVGPhylogenyTree();
}

function renderSVGPhylogenyTree() {
    treeCanvasEl.innerHTML = `
        <svg width="100%" height="100%" viewBox="0 0 750 380" xmlns="http://www.w3.org/2000/svg">
            <style>
                .line-main { stroke: #333333; stroke-width: 2.5; fill: none; }
                .node-text { fill: #111111; font-size: 11px; font-weight: bold; }
                .latin-text { fill: #555555; font-size: 10px; font-style: italic; }
                .group-label { fill: #000000; font-size: 11px; font-weight: bold; }
            </style>

            <path d="M 20 190 L 80 190" class="line-main" />
            <text x="10" y="210" class="node-text">Nenek Moyang Bersama</text>

            <path d="M 80 190 L 80 100 L 150 100" class="line-main" />
            <text x="90" y="90" class="group-label">Famili Felidae</text>

            <path d="M 150 100 L 150 40 L 250 40" class="line-main" />
            <text x="260" y="44" class="node-text">🐅 Harimau, 🦁 Singa, 🐆 Jaguar <tspan class="latin-text">(Genus Panthera)</tspan></text>

            <path d="M 150 100 L 250 100" class="line-main" />
            <text x="260" y="104" class="node-text">🎷 Cheetah <tspan class="latin-text">(Genus Acinonyx)</tspan></text>

            <path d="M 150 100 L 150 150 L 250 150" class="line-main" />
            <text x="260" y="154" class="node-text">🐈 Kucing Bengal <tspan class="latin-text">(Genus Prionailurus)</tspan></text>

            <path d="M 80 190 L 80 280 L 150 280" class="line-main" />
            <text x="90" y="295" class="group-label">Famili Cercopithecidae</text>

            <path d="M 150 280 L 150 220 L 250 220" class="line-main" />
            <text x="260" y="224" class="node-text">🐒 Beruk & 🐵 Monyet Ekor Panjang <tspan class="latin-text">(Genus Macaca)</tspan></text>

            <path d="M 150 280 L 250 260" class="line-main" />
            <text x="260" y="264" class="node-text">🦧 Babon Anubis <tspan class="latin-text">(Genus Papio)</tspan></text>

            <path d="M 150 280 L 150 310 L 250 310" class="line-main" />
            <text x="260" y="314" class="node-text">🦍 Lutung Kelabu <tspan class="latin-text">(Genus Trachypithecus)</tspan></text>

            <path d="M 150 280 L 150 350 L 250 350" class="line-main" />
            <text x="260" y="354" class="node-text">🦥 Surili <tspan class="latin-text">(Kelompok Presbytini)</tspan></text>
        </svg>
    `;
}

document.getElementById('btn-reset').onclick = initGame;
document.getElementById('btn-run').onclick = runTrainAndBuildTree;

initGame();
</script>
</body>
</html>
